[workspace]
resolver = "2"
members = [
	"crates/starknet-devnet-types",
	"crates/starknet-devnet-core",
	"crates/starknet-devnet-server",
	"crates/starknet-devnet",
	"tests/integration",
]

[profile.release]
panic = "unwind"

[workspace.package]
authors = ["0xSpaceShard"]
edition = "2021"
repository = "https://github.com/0xSpaceShard/starknet-devnet"
license-file = "LICENSE"
homepage = "https://0xspaceshard.github.io/starknet-devnet"
description = "A local testnet for Starknet"
readme = "README.md"
documentation = "https://0xspaceshard.github.io/starknet-devnet/docs/intro"

exclude = [".github/**", ".devcontainer/**", ".circleci/**"]

keywords = ["starknet", "cairo", "testnet", "local", "server"]

[workspace.lints.clippy]
unwrap-used = "deny"
expect-used = "deny"

[workspace.lints.rust]
dead-code = "warn"


[workspace.dependencies]

# axum
axum = { version = "0.8", features = ["ws"] }
http-body-util = { version = "0.1" }
tower-http = { version = "0.6", features = ["full"] }

# async
tokio = { version = "1.48.0", features = [
	"time",
	"macros",
	"rt-multi-thread",
	"signal",
	"sync",
] }
futures = "0.3"
async-trait = "0.1"

# tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }

# misc
base64 = { version = "0.22" }
clap = { version = "4.5", features = ["derive", "env"] }
flate2 = { version = ">= 1.0.26, < 1.0.27" }
nonzero_ext = "0.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145" }
serde_yaml = { version = "0.9.27" }
thiserror = { version = "2.0.17" }
anyhow = "1"
indexmap = "2.12.0"
rand = "0.9.2"
rand_chacha = "0.9.0"
rand_mt = "5.0.0"
rand_regex = "0.18.1"
reqwest = { version = "0.12.24", features = ["json"] }
url = "2.5"
usc = { version = "2.7.0", package = "universal-sierra-compiler" }
num-bigint = { version = "0.4" }
bigdecimal = { version = "0.4.9" }
enum-helper-macros = "0.0.1"
lru = "0.16.2"
once_cell = "1.21.3"
ahash = "0.8"

# Starknet dependencies
starknet-types-core = "0.2.4"
starknet_api = { git = "https://github.com/starkware-libs/sequencer", tag = "APOLLO-PRE-PROOF-DEMO-11", features = ["testing"] }
blockifier = { git = "https://github.com/starkware-libs/sequencer", tag = "APOLLO-PRE-PROOF-DEMO-11" }

starknet-rs-signers = { git = "https://github.com/m-kus/starknet-rs", rev = "20b1ddebc133753f3666acde24a35b77e2a9522a", package = "starknet-signers" }
starknet-rs-core = { git = "https://github.com/m-kus/starknet-rs", rev = "20b1ddebc133753f3666acde24a35b77e2a9522a", package = "starknet-core" }
starknet-rs-providers = { git = "https://github.com/m-kus/starknet-rs", rev = "20b1ddebc133753f3666acde24a35b77e2a9522a", package = "starknet-providers" }
starknet-rs-accounts = { git = "https://github.com/m-kus/starknet-rs", rev = "20b1ddebc133753f3666acde24a35b77e2a9522a", package = "starknet-accounts" }
starknet-rs-contract = { git = "https://github.com/m-kus/starknet-rs", rev = "20b1ddebc133753f3666acde24a35b77e2a9522a", package = "starknet-contract" }

cairo-vm = "3.0.1"

# Cairo-lang dependencies
cairo-lang-starknet-classes = "2.14.1-dev.3"
cairo-lang-compiler = "2.14.1-dev.3"
cairo-lang-casm = "2.14.1-dev.3"
cairo-lang-defs = "2.14.1-dev.3"
cairo-lang-diagnostics = "2.14.1-dev.3"
cairo-lang-filesystem = "2.14.1-dev.3"
cairo-lang-lowering = "2.14.1-dev.3"
cairo-lang-semantic = "2.14.1-dev.3"
cairo-lang-sierra = "2.14.1-dev.3"
cairo-lang-sierra-generator = "2.14.1-dev.3"
cairo-lang-sierra-to-casm = "2.14.1-dev.3"
cairo-lang-syntax = "2.14.1-dev.3"
cairo-lang-utils = "2.14.1-dev.3"

# Inner dependencies
starknet-types = { version = "0.7.2", path = "crates/starknet-devnet-types", package = "starknet-devnet-types" }
starknet-core = { version = "0.7.2", path = "crates/starknet-devnet-core", package = "starknet-devnet-core" }
server = { version = "0.7.2", path = "crates/starknet-devnet-server", package = "starknet-devnet-server" }

# Dependabot alerts
zerocopy = "0.8.27"
unsafe-libyaml = "0.2.11"
h2 = "0.4"
ring = "0.17.14"


alloy = { version = "1.1.1" }
eyre = "0.6"

# Changed from 0.10 to 0.10.72 as suggested by Dependabot: https://github.com/0xSpaceShard/starknet-devnet/security/dependabot/53
openssl = { version = "0.10.72", features = ["vendored"] }

parking_lot = "0.12.3"

# Metrics
prometheus = "0.13"

# Dev dependencies
serial_test = "3.1.1"
hex = "0.4.3"
lazy_static = { version = "1.4.0" }
tokio-tungstenite = { version = "0.28.0" }
listeners = "0.2.1"

# https://github.com/paritytech/parity-scale-codec/issues/656
parity-scale-codec = "=3.7.5"
parity-scale-codec-derive = "=3.7.5"

# https://app.circleci.com/pipelines/github/0xSpaceShard/starknet-devnet/3033/workflows/3f93463c-7550-432b-8868-9bb0bf96dc10/jobs/5012
cargo-platform = "=0.1.8"
